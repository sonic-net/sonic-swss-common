# C/C++ with GCC
# Build your C/C++ project with GCC using make.
# Add steps that publish test results, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/c-cpp/gcc
pr:
- master
- 202???
- 201???

trigger:
  batch: true
  branches:
    include:
    - master
    - 202???
    - 201???

# this part need to be set in UI
schedules:
- cron: "0 0 * * 6"
  displayName: Weekly build
  branches:
    include:
    - master
    - 202???
    - 201???
  always: true

resources:
  repositories:
  - repository: sonic-sairedis
    type: github
    name: sonic-net/sonic-sairedis
    endpoint: sonic-net
    ref: refs/heads/master
  - repository: sonic-swss
    type: github
    name: sonic-net/sonic-swss
    endpoint: sonic-net
    ref: refs/heads/master
  - repository: sonic_swss_common
    type: github
    name: sonic-net/sonic-swss-common
    endpoint: sonic-net
    ref: refs/heads/master

parameters:
  - name: debian_version
    type: string
    default: trixie
variables:
  - name: BUILD_BRANCH
    ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
      value: $(System.PullRequest.TargetBranch)
    ${{ else }}:
      value: $(Build.SourceBranchName)

stages:
- stage: Build

  jobs:
  # The ubuntu-22.04 job installs bookworm DEBs/wheels on jammy.
  - template: .azure-pipelines/build-ubuntu-template.yml
    parameters:
      debian_version: bookworm

  - template: .azure-pipelines/build-template.yml
    parameters:
      arch: amd64
      artifact_name: sonic-swss-common-${{ parameters.debian_version }}
      run_unit_test: true
      archive_gcov: true
      debian_version: ${{ parameters.debian_version }}

  # The sonic-sairedis, sonic-swss and docker-sonic-vs stages below build and
  # test on bookworm.
  - template: .azure-pipelines/build-template.yml
    parameters:
      arch: amd64
      display_name: amd64/bookworm
      artifact_name: sonic-swss-common-bookworm
      debian_version: bookworm

- stage: BuildArm
  dependsOn: Build
  condition: succeeded('Build')
  jobs:
  - template: .azure-pipelines/build-template.yml
    parameters:
      arch: armhf
      timeout: 180
      pool: sonicso1ES-armhf
      artifact_name: sonic-swss-common-${{ parameters.debian_version }}.armhf
      debian_version: ${{ parameters.debian_version }}

  - template: .azure-pipelines/build-template.yml
    parameters:
      arch: arm64
      timeout: 180
      pool: sonicso1ES-arm64
      artifact_name: sonic-swss-common-${{ parameters.debian_version }}.arm64
      debian_version: ${{ parameters.debian_version }}

- stage: BuildBookworm
  dependsOn: BuildArm
  condition: succeeded('BuildArm')
  jobs:
  - template: .azure-pipelines/build-template.yml
    parameters:
      arch: armhf
      timeout: 180
      pool: sonicso1ES-armhf
      artifact_name: sonic-swss-common-bookworm.armhf
      debian_version: bookworm

  - template: .azure-pipelines/build-template.yml
    parameters:
      arch: arm64
      timeout: 180
      pool: sonicso1ES-arm64
      artifact_name: sonic-swss-common-bookworm.arm64
      debian_version: bookworm

- stage: BuildSairedis
  dependsOn: Build
  condition: succeeded('Build')
  jobs:
  - template: .azure-pipelines/build-template.yml@sonic-sairedis
    parameters:
      repo: sonic-sairedis
      arch: amd64
      pool: sonicso1ES-amd64
      timeout: 90
      artifact_name: sonic-sairedis-bookworm
      syslog_artifact_name: sonic-sairedis.syslog
      debian_version: bookworm
      staged_upstreams:
        - artifact: sonic-swss-common-bookworm
          name: sonic-swss-common

- stage: BuildSwss
  dependsOn: BuildSairedis
  condition: succeeded('BuildSairedis')
  jobs:
  - template: .azure-pipelines/build-template.yml@sonic-swss
    parameters:
      repo: sonic-swss
      arch: amd64
      pool: sonicso1ES-amd64
      # sonic-swss is a large compile that intermittently exceeds the 90m default;
      # give it more headroom to avoid spurious timeouts.
      timeout: 120
      artifact_name: sonic-swss-bookworm
      debian_version: bookworm
      staged_upstreams:
        - artifact: sonic-swss-common-bookworm
          name: sonic-swss-common
        - artifact: sonic-sairedis-bookworm
          name: sonic-sairedis

- stage: BuildDocker
  dependsOn: BuildSwss
  condition: succeeded('BuildSwss')
  jobs:
  - template: .azure-pipelines/build-docker-sonic-vs-template.yml@sonic-swss
    parameters:
      repo: sonic-swss
      swss_common_artifact_name: sonic-swss-common-bookworm
      swss_common_current_run: true
      sairedis_artifact_name: sonic-sairedis-bookworm
      sairedis_current_run: true
      swss_artifact_name: sonic-swss-bookworm
      artifact_name: docker-sonic-vs
      include_gcov: false
      include_vpp: true

- stage: Test
  dependsOn: BuildDocker
  condition: succeeded('BuildDocker')
  jobs:
  - template: .azure-pipelines/test-docker-sonic-vs-template.yml@sonic-swss
    parameters:
      repo: sonic-swss
      timeout: 360
      log_artifact_name: log
      debian_version: bookworm
      pytest_params: '--force-flaky --force-recreate-dvs'
      continue_on_error: ${{ ne(variables['Build.Reason'], 'PullRequest') }}
      staged_upstreams:
        - artifact: sonic-swss-common.amd64.ubuntu22_04
          name: sonic-swss-common-test-host

- stage: BuildenvSetupUnitTests
  # Runs the ci/buildenv_setup unit tests. Independent (dependsOn: []) so it runs in
  # parallel and gates nothing else; its own result still contributes to the pipeline.
  dependsOn: []
  jobs:
  - job:
    displayName: "buildenv_setup unit tests"
    pool:
      vmImage: 'ubuntu-22.04'
    steps:
    - script: |
        sudo pip3 install pytest pyyaml requests
      displayName: "Install test dependencies"
    - script: |
        PYTHONPATH=. python3 -m pytest tests/ -v --junitxml=$(Build.ArtifactStagingDirectory)/buildenv_setup-tests.xml
      workingDirectory: ci
      displayName: "Run buildenv_setup unit tests"
    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: '$(Build.ArtifactStagingDirectory)/buildenv_setup-tests.xml'
        testRunTitle: 'buildenv_setup unit tests'
