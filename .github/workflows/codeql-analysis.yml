# For more infomation, please visit: https://github.com/github/codeql-action

name: "CodeQL"

on:
  push:
    branches:
      - 'master'
      - '202[0-9][0-9][0-9]'
  pull_request:
    branches:
      - 'master'
      - '202[0-9][0-9][0-9]'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        config-file: ./.github/codeql/codeql-config.yml
        languages: ${{ matrix.language }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        category: "/language:${{matrix.language}}"

  analyze-cpp:
    name: Analyze (cpp)
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-20260918
      options: --init
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Install host build tools
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          binutils build-essential ca-certificates git python3 tar

    - name: Checkout repository
      uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

    - name: Configure Git for the container checkout
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-version: 1.29.0
        bazelisk-cache: true
        repository-cache: true
        cache-version: "8.5.1"

    - name: Verify Rust source inputs
      run: |
        test ! -e Cargo.Bazel.lock
        git ls-files --error-unmatch Cargo.lock

    - name: Record maintained registry inputs
      run: |
        python3 tools/bazel/go_validation.py record artifacts/codeql-go-inputs
        git rev-parse HEAD > artifacts/codeql-go-inputs/tested-revision.txt

    - name: Prepare declared dependency tools before tracing
      shell: bash
      run: |
        base="$(mktemp -d "$RUNNER_TEMP/codeql-bazel-output.XXXXXX")"
        printf '%s\n' "$base" > artifacts/codeql-go-inputs/build-output-base.txt
        printf 'COMMON_CODEQL_OUTPUT_BASE=%s\n' "$base" >> "$GITHUB_ENV"
        export COMMON_CODEQL_OUTPUT_BASE="$base"
        bash tools/bazel/codeql/build.sh prepare

    - name: Initialize CodeQL
      uses: github/codeql-action/init@b8d3b6e8af63cde30bdc382c0bc28114f4346c88 # v2.28.1
      with:
        config-file: ./.github/codeql/codeql-config.yml
        languages: cpp
        # Match the CLI used by the legacy job, which supports GCC 14.2.
        tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.0/codeql-bundle-linux64.tar.gz

    - name: Build Common C++ under CodeQL tracing
      shell: bash
      run: bash tools/bazel/codeql/build.sh trace

    - name: Upload Rust dependency evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sonic-swss-common-codeql-rust-dependencies
        path: |
          Cargo.lock
          MODULE.bazel.lock
        if-no-files-found: error

    - name: Record resolved Go inputs
      if: always()
      run: >-
        python3 tools/bazel/go_validation.py collect artifacts/codeql-go-inputs
        --output-base-file artifacts/codeql-go-inputs/build-output-base.txt

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@b8d3b6e8af63cde30bdc382c0bc28114f4346c88 # v2.28.1
      with:
        category: "/language:cpp"

    - name: Upload resolved build inputs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sonic-swss-common-codeql-go-inputs
        path: artifacts/codeql-go-inputs/
        if-no-files-found: error
